<!DOCTYPE html>
<html>

<head>

    <title>Edit Subject</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>✏️ Edit Subject</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Exam Type</label>

                    <input
                        type="text"
                        name="exam_type"
                        class="form-control"
                        value="{{ subject.exam_type }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Subject Name</label>

                    <input
                        type="text"
                        name="subject_name"
                        class="form-control"
                        value="{{ subject.subject_name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Subject Code</label>

                    <input
                        type="text"
                        name="subject_code"
                        class="form-control"
                        value="{{ subject.subject_code }}">

                </div>

                <div class="mb-4">

                    <label>Status</label>

                    <select
                        name="status"
                        class="form-control">

                        <option value="Active"
                            {% if subject.status=="Active" %}selected{% endif %}>
                            Active
                        </option>

                        <option value="Inactive"
                            {% if subject.status=="Inactive" %}selected{% endif %}>
                            Inactive
                        </option>

                    </select>

                </div>

                <button class="btn btn-success">

                    💾 Update Subject

                </button>

                <a href="/manage_subjects"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
