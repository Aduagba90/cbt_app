<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg, #0d6efd, #00d4ff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .login-card{
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.15);
        }

        .title{
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .btn-login{
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
        }

    </style>
</head>
<body>

<div class="login-card">

    <h2 class="title">
        Admin Login
    </h2>

    <form method="POST">

        <div class="mb-3">

            <label>Email</label>

            <input type="email"
                   name="email"
                   class="form-control"
                   required>

        </div>

        <div class="mb-4">

            <label>Password</label>

            <input type="password"
                   name="password"
                   class="form-control"
                   required>

        </div>

        <button class="btn btn-primary btn-login">
            Login
        </button>

    </form>

</div>

</body>
</html>
