<!DOCTYPE html>
<html>
<head>
    <title>Edit Question</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            ✏️ Edit Question
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label>Exam Type</label>

                <input type="text"
                       name="exam_type"
                       class="form-control"
                       value="{{ question[1] }}"
                       required>
            </div>

            <div class="mb-3">
                <label>Subject</label>

                <input type="text"
                       name="subject"
                       class="form-control"
                       value="{{ question[2] }}"
                       required>
            </div>

            <div class="mb-3">
                <label>Question</label>

                <textarea name="question"
                          class="form-control"
                          rows="4"
                          required>{{ question[3] }}</textarea>
            </div>

            <div class="mb-3">
                <label>Option A</label>

                <input type="text"
                       name="option_a"
                       class="form-control"
                       value="{{ question[4] }}"
                       required>
            </div>

            <div class="mb-3">
                <label>Option B</label>

                <input type="text"
                       name="option_b"
                       class="form-control"
                       value="{{ question[5] }}"
                       required>
            </div>

            <div class="mb-3">
                <label>Option C</label>

                <input type="text"
                       name="option_c"
                       class="form-control"
                       value="{{ question[6] }}"
                       required>
            </div>

            <div class="mb-3">
                <label>Option D</label>

                <input type="text"
                       name="option_d"
                       class="form-control"
                       value="{{ question[7] }}"
                       required>
            </div>

            <div class="mb-3">
                <label>Correct Answer</label>

                <select name="correct_answer"
                        class="form-control"
                        required>

                    <option value="A"
                        {% if question[8] == "A" %}selected{% endif %}>
                        Option A
                    </option>

                    <option value="B"
                        {% if question[8] == "B" %}selected{% endif %}>
                        Option B
                    </option>

                    <option value="C"
                        {% if question[8] == "C" %}selected{% endif %}>
                        Option C
                    </option>

                    <option value="D"
                        {% if question[8] == "D" %}selected{% endif %}>
                        Option D
                    </option>

                </select>
            </div>

            <div class="mb-4">
                <label>Explanation</label>

                <textarea name="explanation"
                          class="form-control"
                          rows="5"
                          required>{{ question[9] }}</textarea>
            </div>

            <button class="btn btn-primary">

                💾 Save Changes

            </button>

            <a href="/manage_questions"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>
</html>
