<!DOCTYPE html>
<html>
<head>
    <title>Select Subject</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            background: #f4f7fc;
            font-family: 'Poppins', sans-serif;
        }

        .container-box{
            max-width: 900px;
            margin: auto;
            margin-top: 60px;
        }

        .title{
            text-align: center;
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .subject-card{
            background: white;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .subject-card:hover{
            transform: translateY(-5px);
        }

        .subject-name{
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .btn-start{
            border-radius: 12px;
            padding: 12px 25px;
            font-weight: 600;
        }

    </style>
</head>
<body>

<div class="container container-box">

    <h1 class="title">
        Select Subject
    </h1>

    <div class="row">

        {% for subject in subjects %}

        <div class="col-md-4 mb-4">

            <div class="subject-card">

                <div class="subject-name">
                    {{ subject[0] }}
                </div>

                <a href="/question/{{ exam_type }}/{{ subject[0] }}"
                   class="btn btn-primary btn-start">

                    Start Practice
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
