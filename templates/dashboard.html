<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">CBT Dashboard</span>
        <a href="/logout" class="btn btn-light">Logout</a>
    </div>
</nav>

<div class="container mt-5">

    <h2>Welcome, {{ user }}</h2>
    <p class="text-muted">Choose what you want to do</p>

    <div class="row mt-4">

        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <h5>Start Exam</h5>
                <p>Practice CBT questions with timer.</p>
                <a href="/exam_types" class="btn btn-primary">Start</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <h5>Practice Mode</h5>
                <p>Learn with explanations.</p>
                <a href="#" class="btn btn-success">Practice</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <h5>View Results</h5>
                <p>Check your performance.</p>
                <a href="#" class="btn btn-warning">Results</a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
