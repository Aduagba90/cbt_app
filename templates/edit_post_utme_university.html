<!DOCTYPE html>
<html>
<head>

    <title>Edit University</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header">

            <h3>
                ✏️ Edit University
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>
                        University Name
                    </label>

                    <input type="text"
                           name="university_name"
                           class="form-control"
                           value="{{ university[1] }}"
                           required>

                </div>

                <div class="mb-3">

                    <label>
                        Exam Mode
                    </label>

                    <select name="exam_mode"
                            class="form-control">

                        <option value="CBT"
                            {% if university[2]=="CBT" %}
                                selected
                            {% endif %}>
                            CBT
                        </option>

                        <option value="APTITUDE"
                            {% if university[2]=="APTITUDE" %}
                                selected
                            {% endif %}>
                            APTITUDE
                        </option>

                        <option value="CURRENT_AFFAIRS"
                            {% if university[2]=="CURRENT_AFFAIRS" %}
                                selected
                            {% endif %}>
                            CURRENT AFFAIRS
                        </option>

                        <option value="SCREENING"
                            {% if university[2]=="SCREENING" %}
                                selected
                            {% endif %}>
                            SCREENING
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label>
                        Duration (Minutes)
                    </label>

                    <input type="number"
                           name="duration"
                           class="form-control"
                           value="{{ university[3] }}">

                </div>

                <div class="mb-3">

                    <label>
                        Total Questions
                    </label>

                    <input type="number"
                           name="total_questions"
                           class="form-control"
                           value="{{ university[4] }}">

                </div>

                <div class="mb-3">

                    <label>
                        Pass Mark
                    </label>

                    <input type="number"
                           name="pass_mark"
                           class="form-control"
                           value="{{ university[5] }}">

                </div>

                <button class="btn btn-success">

                    💾 Save Changes

                </button>

                <a href="/manage_post_utme_universities"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
