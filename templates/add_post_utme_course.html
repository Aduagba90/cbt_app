<!DOCTYPE html>
<html>
<head>

<title>Add Course</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header">

            <h3>
                ➕ Add POST-UTME Course
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>
                        University
                    </label>

                    <select
                        name="university_name"
                        class="form-control"
                        required>

                        <option value="">
                            Select University
                        </option>

                        {% for u in universities %}

                        <option value="{{ u[0] }}">
                            {{ u[0] }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label>
                        Course Name
                    </label>

                    <input
                        type="text"
                        name="course_name"
                        class="form-control"
                        required>

                </div>

                <button
                    class="btn btn-success">

                    ➕ Add Course

                </button>

                <a href="/manage_post_utme_courses"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
