<!DOCTYPE html>
<html>
<head>

<title>Add Subject Combination</title>

<link href="/static/vendor/bootstrap/bootstrap.min.css"
      rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header">

            <h3>
                ➕ Add Subject Combination
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">

                    <label>
                        Course
                    </label>

                    <select
                        name="course_name"
                        class="form-control"
                        required>

                        <option value="">
                            Select Course
                        </option>

                        {% for c in courses %}

                        <option value="{{ c[0] }}">
                            {{ c[0] }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label>
                        Subject
                    </label>

                    <input
                        type="text"
                        name="subject_name"
                        class="form-control"
                        required>

                </div>

                <button
                    class="btn btn-success">

                    ➕ Add Subject

                </button>

                <a href="/manage_subject_combinations"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
