<!DOCTYPE html>
<html>
<head>
    <title>CBT Master</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0f1c;
            color: white;
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
        }

        /* Hero */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        /* Glow text */
        .glow {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px #0d6efd, 0 0 20px #00d4ff;
        }

        /* Typing cursor */
        #typing::after {
            content: "|";
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% {opacity: 1;}
            50% {opacity: 0;}
            100% {opacity: 1;}
        }

        /* Cards */
        .card {
            background: rgba(255,255,255,0.05);
            border: none;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-12px) scale(1.02);
        }

        /* Button */
        .btn-main {
            background: linear-gradient(90deg, #0d6efd, #00d4ff);
            border: none;
        }

        .btn-main:hover {
            opacity: 0.9;
        }

        /* Particles canvas */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <span class="navbar-brand fw-bold">CBT Master</span>

        <div>
            <a href="/login" class="btn btn-outline-light me-2">Login</a>
            <a href="/register" class="btn btn-main text-white">Get Started</a>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="hero">

    <!-- Particles -->
    <div id="particles-js"></div>

    <div data-aos="zoom-in">
        <h1 class="glow">
            <span id="typing"></span>
        </h1>

        <p class="mt-3 text-light">
            Practice JAMB & WAEC CBT with real questions and full explanations
        </p>

        <a href="/register" class="btn btn-main btn-lg mt-4 px-5">
            Start Practicing
        </a>
    </div>

</section>

<!-- Features -->
<section class="container mt-5">
    <div class="row text-center">

        <div class="col-md-4 mb-4" data-aos="fade-up">
            <div class="card p-4 shadow">
                <h4>🧠 Smart Learning</h4>
                <p>Understand every question deeply.</p>
            </div>
        </div>

        <div class="col-md-4 mb-4" data-aos="fade-up" data-aos-delay="200">
            <div class="card p-4 shadow">
                <h4>⏱ Real CBT</h4>
                <p>Simulate real exam environment.</p>
            </div>
        </div>

        <div class="col-md-4 mb-4" data-aos="fade-up" data-aos-delay="400">
            <div class="card p-4 shadow">
                <h4>📊 Progress</h4>
                <p>Track your improvement easily.</p>
            </div>
        </div>

    </div>
</section>

<!-- CTA -->
<section class="text-center mt-5 mb-5" data-aos="fade-up">
    <h2 class="fw-bold">Ready to pass your exam?</h2>
    <a href="/register" class="btn btn-main btn-lg mt-3 px-5">Join Now</a>
</section>

<!-- Scripts -->

<!-- AOS -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<!-- Particles -->
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<script>
AOS.init();

// Typing animation
const text = "Pass JAMB & WAEC With Confidence";
let i = 0;

function typingEffect() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typingEffect, 50);
    }
}
typingEffect();

// Particles config
particlesJS("particles-js", {
  particles: {
    number: { value: 60 },
    size: { value: 3 },
    move: { speed: 2 },
    line_linked: { enable: true },
  }
});
</script>

</body>
</html>
