<!DOCTYPE html>
<html>
<head>

    <title>Edit Course</title>

    <link href="/static/vendor/bootstrap/bootstrap.min.css"
          rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header">

            <h3>
                ✏️ Edit Course
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">

                    <label>
                        University
                    </label>

                    <select
                        name="university_name"
                        class="form-control"
                        required>

                        {% for u in universities %}

                        <option
                            value="{{ u[0] }}"
                            {% if u[0] == course[1] %}
                                selected
                            {% endif %}
                        >
                            {{ u[0] }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label>
                        Course Name
                    </label>

                    <input
                        type="text"
                        name="course_name"
                        class="form-control"
                        value="{{ course[2] }}"
                        required>

                </div>

                <button
                    class="btn btn-success">

                    💾 Save Changes

                </button>

                <a href="/manage_post_utme_courses"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
