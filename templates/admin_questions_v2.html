<!DOCTYPE html>
<html>

<head>

    <title>Add Question (V2)</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">
        📝 Add Question (V2)
    </h2>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }} alert-dismissible fade show">

                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                    </button>

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form method="POST">

        <!-- Exam Type -->

        <div class="mb-3">

            <label class="form-label">

                Exam Type

            </label>

            <select
                id="exam_type"
                name="exam_type_id"
                class="form-control"
                required>

                <option value="">

                    Select Exam Type

                </option>

                {% for exam in exam_types %}

                <option value="{{ exam.id }}">

                    {{ exam.exam_name }}

                </option>

                {% endfor %}

            </select>

        </div>

        <!-- Subject -->

        <div class="mb-3">

            <label class="form-label">

                Subject

            </label>

            <select
                id="subject"
                name="subject_id"
                class="form-control"
                required>

                <option value="">

                    Select Subject

                </option>

            </select>

        </div>

        <!-- Topic -->

        <div class="mb-3">

            <label class="form-label">

                Topic

            </label>

            <select
                id="topic"
                name="topic_id"
                class="form-control"
                required>

                <option value="">

                    Select Topic

                </option>

            </select>

        </div>

        <hr>

        <!-- Question -->

        <div class="mb-3">

            <label class="form-label">

                Question

            </label>

            <textarea
                name="question_text"
                rows="5"
                class="form-control"
                required></textarea>

        </div>

        <!-- Option A -->

        <div class="mb-3">

            <label>Option A</label>

            <input
                type="text"
                name="option_a"
                class="form-control"
                required>

        </div>

        <!-- Option B -->

        <div class="mb-3">

            <label>Option B</label>

            <input
                type="text"
                name="option_b"
                class="form-control"
                required>

        </div>

        <!-- Option C -->

        <div class="mb-3">

            <label>Option C</label>

            <input
                type="text"
                name="option_c"
                class="form-control"
                required>

        </div>

        <!-- Option D -->

        <div class="mb-3">

            <label>Option D</label>

            <input
                type="text"
                name="option_d"
                class="form-control"
                required>

        </div>

        <!-- Correct Answer -->

        <div class="mb-3">

            <label>

                Correct Answer

            </label>

            <select
                name="correct_answer"
                class="form-control">

                <option>A</option>
                <option>B</option>
                <option>C</option>
                <option>D</option>

            </select>

        </div>

        <!-- Difficulty -->

        <div class="mb-3">

            <label>

                Difficulty

            </label>

            <select
                name="difficulty"
                class="form-control">

                <option>Easy</option>
                <option selected>Medium</option>
                <option>Hard</option>

            </select>

        </div>

        <!-- Explanation -->

        <div class="mb-3">

            <label>

                Explanation

            </label>

            <textarea
                name="explanation"
                rows="4"
                class="form-control"></textarea>

        </div>

        <button
            class="btn btn-primary">

            💾 Save Question

        </button>

    </form>

</div>

<script>

document.getElementById("exam_type").addEventListener("change", function () {

    let examTypeId = this.value;

    fetch("/get_subjects/" + examTypeId)

    .then(response => response.json())

    .then(data => {

        let subject = document.getElementById("subject");

        subject.innerHTML =
            '<option value="">Select Subject</option>';

        document.getElementById("topic").innerHTML =
            '<option value="">Select Topic</option>';

        data.subjects.forEach(function(item){

            subject.innerHTML +=
                `<option value="${item.id}">
                    ${item.subject_name}
                </option>`;

        });

    });

});

document.getElementById("subject").addEventListener("change", function () {

    let subjectId = this.value;

    fetch("/get_topics/" + subjectId)

    .then(response => response.json())

    .then(data => {

        let topic = document.getElementById("topic");

        topic.innerHTML =
            '<option value="">Select Topic</option>';

        data.topics.forEach(function(item){

            topic.innerHTML +=
                `<option value="${item.id}">
                    ${item.topic_name}
                </option>`;

        });

    });

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
