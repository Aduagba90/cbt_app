{% macro share_row(url, text, label='Share') %}
<div class="pn-share" data-share-url="{{ url }}" data-share-text="{{ text }}">
    <span class="pn-share-label"><i class="bi bi-share-fill me-1"></i>{{ label }}</span>
    <a class="pn-share-btn wa" href="https://wa.me/?text={{ (text ~ ' ' ~ url)|urlencode }}" target="_blank" rel="noopener" aria-label="Share on WhatsApp" title="Share on WhatsApp"><i class="bi bi-whatsapp"></i></a>
    <a class="pn-share-btn x" href="https://twitter.com/intent/tweet?text={{ (text ~ ' ' ~ url)|urlencode }}" target="_blank" rel="noopener" aria-label="Share on X" title="Share on X"><i class="bi bi-twitter-x"></i></a>
    <a class="pn-share-btn fb" href="https://www.facebook.com/sharer/sharer.php?u={{ url|urlencode }}" target="_blank" rel="noopener" aria-label="Share on Facebook" title="Share on Facebook"><i class="bi bi-facebook"></i></a>
    <button type="button" class="pn-share-btn copy" data-share-copy aria-label="Copy link" title="Copy link"><i class="bi bi-link-45deg"></i></button>
    <button type="button" class="pn-share-btn native" data-share-native aria-label="More share options" title="More share options"><i class="bi bi-share"></i></button>
</div>
{% endmacro %}
