<!DOCTYPE html>
<html>

<head>

    <title>Practice Question</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
        }

        .question-card{
            background:white;
            border-radius:15px;
            padding:30px;
            box-shadow:0 5px 20px rgba(0,0,0,.08);
            max-width:900px;
            margin:auto;
        }

        .option-card{
            border:2px solid #dee2e6;
            border-radius:12px;
            padding:15px;
            margin-bottom:15px;
            transition:.3s;
            cursor:pointer;
        }

        .option-card:hover{
            transform:translateY(-2px);
        }

        .correct-option{
            background:#d1e7dd;
            border-color:#198754;
            color:#0f5132;
            font-weight:bold;
        }

        .wrong-option{
            background:#f8d7da;
            border-color:#dc3545;
            color:#842029;
            font-weight:bold;
        }

        .normal-option{
            background:white;
        }

        .result-icon{
            font-size:22px;
            margin-right:10px;
        }

    </style>

</head>

<body>

<div class="container mt-5 mb-5">

    <div class="question-card">

        <h3>

            {{ exam_type }} - {{ subject }}

        </h3>

        <hr>

        <h4>

            {{ question[1] }}

        </h4>

        <form method="POST">

            <input
                type="hidden"
                name="question_id"
                value="{{ question[0] }}">

            <!-- OPTION A -->

            <label class="option-card

                {% if feedback %}

                    {% if correct_answer == 'A' %}

                        correct-option

                    {% elif selected_answer == 'A' %}

                        wrong-option

                    {% else %}

                        normal-option

                    {% endif %}

                {% else %}

                    normal-option

                {% endif %}

            ">

                <input
                    type="radio"
                    name="answer"
                    value="A"
                    required

                    {% if feedback %}disabled{% endif %}

                    {% if selected_answer == 'A' %}checked{% endif %}

                >

                {% if feedback %}

                    {% if correct_answer == 'A' %}

                        <span class="result-icon">✅</span>

                    {% elif selected_answer == 'A' %}

                        <span class="result-icon">❌</span>

                    {% endif %}

                {% endif %}

                <strong>A.</strong>

                {{ question[2] }}

            </label>

            <!-- OPTION B -->

            <label class="option-card

                {% if feedback %}

                    {% if correct_answer == 'B' %}

                        correct-option

                    {% elif selected_answer == 'B' %}

                        wrong-option

                    {% else %}

                        normal-option

                    {% endif %}

                {% else %}

                    normal-option

                {% endif %}

            ">

                <input
                    type="radio"
                    name="answer"
                    value="B"

                    {% if feedback %}disabled{% endif %}

                    {% if selected_answer == 'B' %}checked{% endif %}

                >

                {% if feedback %}

                    {% if correct_answer == 'B' %}

                        <span class="result-icon">✅</span>

                    {% elif selected_answer == 'B' %}

                        <span class="result-icon">❌</span>

                    {% endif %}

                {% endif %}

                <strong>B.</strong>

                {{ question[3] }}

            </label>

            <!-- OPTION C -->

            <label class="option-card

                {% if feedback %}

                    {% if correct_answer == 'C' %}

                        correct-option

                    {% elif selected_answer == 'C' %}

                        wrong-option

                    {% else %}

                        normal-option

                    {% endif %}

                {% else %}

                    normal-option

                {% endif %}

            ">

                <input
                    type="radio"
                    name="answer"
                    value="C"

                    {% if feedback %}disabled{% endif %}

                    {% if selected_answer == 'C' %}checked{% endif %}

                >

                {% if feedback %}

                    {% if correct_answer == 'C' %}

                        <span class="result-icon">✅</span>

                    {% elif selected_answer == 'C' %}

                        <span class="result-icon">❌</span>

                    {% endif %}

                {% endif %}

                <strong>C.</strong>

                {{ question[4] }}

            </label>

            <!-- OPTION D -->

            <label class="option-card

                {% if feedback %}

                    {% if correct_answer == 'D' %}

                        correct-option

                    {% elif selected_answer == 'D' %}

                        wrong-option

                    {% else %}

                        normal-option

                    {% endif %}

                {% else %}

                    normal-option

                {% endif %}

            ">

                <input
                    type="radio"
                    name="answer"
                    value="D"

                    {% if feedback %}disabled{% endif %}

                    {% if selected_answer == 'D' %}checked{% endif %}

                >

                {% if feedback %}

                    {% if correct_answer == 'D' %}

                        <span class="result-icon">✅</span>

                    {% elif selected_answer == 'D' %}

                        <span class="result-icon">❌</span>

                    {% endif %}

                {% endif %}

                <strong>D.</strong>

                {{ question[5] }}

            </label>

            {% if feedback %}

                {% if is_correct %}

                    <div class="alert alert-success mt-4">

                        🎉 Correct!

                    </div>

                {% else %}

                    <div class="alert alert-danger mt-4">

                        ❌ Incorrect!

                    </div>

                {% endif %}

                <div class="card mt-3">

                    <div class="card-body">

                        <h5>

                            Correct Answer

                        </h5>

                        <p>

                            <strong>{{ correct_answer }}</strong>

                        </p>

                    </div>

                </div>

                <div class="card mt-3">

                    <div class="card-body">

                        <h5>

                            Explanation

                        </h5>

                        <p>

                            {{ explanation }}

                        </p>

                    </div>

                </div>

                <a
                    href="/practice_questions/{{ exam_type }}/{{ subject }}"
                    class="btn btn-primary mt-4">

                    Next Question

                </a>

            {% else %}

                <button
                    type="submit"
                    class="btn btn-success mt-4">

                    Check Answer

                </button>

            {% endif %}

        </form>

        <hr class="mt-4">

        <form
            action="/bookmark_question"
            method="POST">

            <input
                type="hidden"
                name="question_id"
                value="{{ question[0] }}">

            <input
                type="hidden"
                name="exam_type"
                value="{{ exam_type }}">

            <input
                type="hidden"
                name="subject"
                value="{{ subject }}">

            <button
                type="submit"
                class="btn btn-warning">

                ⭐ Bookmark this Question

            </button>

        </form>


    </div>

</div>

</body>

</html>
