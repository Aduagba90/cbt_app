<!DOCTYPE html>
<html>

<head>

    <title>Change Password</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow mx-auto" style="max-width:650px;">

<div class="card-header bg-danger text-white">

<h3 class="mb-0">

🔒 Change Password

</h3>

</div>

<div class="card-body">

{% if message %}

<div class="alert alert-{{ alert_type }}">

{{ message }}

</div>

{% endif %}

<form method="POST">

<div class="mb-3">

<label class="form-label">

Current Password

</label>

<input
type="password"
name="current_password"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

New Password

</label>

<input
type="password"
name="new_password"
class="form-control"
required>

</div>

<div class="mb-4">

<label class="form-label">

Confirm New Password

</label>

<input
type="password"
name="confirm_password"
class="form-control"
required>

</div>

<div class="d-flex gap-2">

<button
class="btn btn-danger">

🔒 Change Password

</button>

<a
href="/profile"
class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
