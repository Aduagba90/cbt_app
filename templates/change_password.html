{% extends "base.html" %}
{% block title %}Change password{% endblock %}

{% block content %}
<div class="pn-page-head anim-rise">
    <div>
        <div class="pn-breadcrumb"><a href="{{ url_for('profile') }}">Profile</a><i class="bi bi-chevron-right"></i><span>Change password</span></div>
        <h1>Change password</h1>
        <p class="lead">Changing your password signs you out of every other device.</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card anim-rise d1">
            <div class="card-body p-4">
                <form method="POST" data-once>
                    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="current_password">Current password</label>
                        <div class="pn-password-wrap">
                            <input type="password" class="form-control" id="current_password" name="current_password" autocomplete="current-password" required>
                            <button type="button" class="pn-eye" data-toggle-password="current_password" aria-label="Show password"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="new_password">New password</label>
                        <div class="pn-password-wrap">
                            <input type="password" class="form-control" id="new_password" name="new_password" autocomplete="new-password" minlength="8" required data-strength-for="pwStrength">
                            <button type="button" class="pn-eye" data-toggle-password="new_password" aria-label="Show password"><i class="bi bi-eye"></i></button>
                        </div>
                        <div class="pn-strength mt-2" id="pwStrength"><span></span><span></span><span></span><span></span></div>
                        <div class="form-text" data-strength-label="pwStrength">At least 8 characters, with letters and numbers.</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="confirm_password">Confirm new password</label>
                        <div class="pn-password-wrap">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
                            <button type="button" class="pn-eye" data-toggle-password="confirm_password" aria-label="Show password"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button class="btn btn-primary px-4" data-loading="Updating…"><i class="bi bi-shield-check me-1"></i> Update password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
