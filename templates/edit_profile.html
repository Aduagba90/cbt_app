<!DOCTYPE html>
<html>

<head>

    <title>Edit Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow mx-auto" style="max-width:700px;">

<div class="card-header bg-primary text-white">

<h3 class="mb-0">

✏️ Edit Profile

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
name="name"
class="form-control"
value="{{ user[0] }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Email Address

</label>

<input
type="email"
class="form-control"
value="{{ user[1] }}"
readonly>

</div>

<div class="mb-3">

<label class="form-label">

Phone Number

</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ user[2] }}"
required>

</div>

<div class="d-flex gap-2">

<button
class="btn btn-success">

💾 Save Changes

</button>

<a
href="/profile"
class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
