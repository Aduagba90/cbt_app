{% extends "base.html" %}
{% block title %}{{ code }} — {{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 text-center py-5 anim-rise">
        <div class="pn-error-code">{{ code }}</div>
        <span class="pn-stat-icon {{ 'tint-gold' if code == 404 else ('tint-blue' if code == 429 else 'tint-red') }} mx-auto mb-3" style="width:64px;height:64px;font-size:1.7rem">
            <i class="bi {{ 'bi-compass' if code == 404 else ('bi-hourglass-split' if code == 429 else ('bi-shield-lock' if code == 403 else 'bi-emoji-dizzy')) }}"></i>
        </span>
        <h1 class="h3">{{ title }}</h1>
        <p class="text-muted mb-4">{{ message }}</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            {% if session.get('user') %}
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary"><i class="bi bi-speedometer2 me-1"></i> Go to dashboard</a>
            {% else %}
            <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house me-1"></i> Go home</a>
            {% endif %}
            <a href="javascript:history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Go back</a>
        </div>
        <p class="small text-muted mt-4">Still stuck? <a href="mailto:{{ support_email }}">Email support</a> or <a href="https://wa.me/{{ support_whatsapp }}" target="_blank" rel="noopener">chat on WhatsApp</a>.</p>
    </div>
</div>
{% endblock %}
