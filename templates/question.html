<!DOCTYPE html>
<html>
<head>
    <title>CBT Exam</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body{
            background: #f4f7fc;
            font-family: 'Poppins', sans-serif;
            padding-bottom: 50px;
        }

        .exam-container{
            max-width: 900px;
            margin: auto;
            padding: 15px;
            margin-top: 30px;
        }

        .question-card{
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.08);
        }

        .question-title{
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #222;
        }

        .option-box{
            border: 2px solid #eaeaea;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
            transition: 0.3s;
            cursor: pointer;
            background: #fff;
        }

        .option-box:hover{
            background: #f0f6ff;
            border-color: #0d6efd;
            transform: translateY(-3px);
        }

        input[type="radio"]{
            transform: scale(1.2);
            margin-right: 12px;
        }

        .top-bar{
            background: linear-gradient(135deg, #0d6efd, #0047c7);
            color: white;
            padding: 18px 25px;
            border-radius: 18px;
            margin-bottom: 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;

            box-shadow: 0px 10px 20px rgba(13,110,253,0.2);
        }

        .exam-info{
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .exam-type{
            font-size: 15px;
            opacity: 0.9;
        }

        .subject{
            font-size: 20px;
            font-weight: 600;
        }

        .timer-box{
            background: rgba(255,255,255,0.15);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            margin-top: 10px;
        }

        .submit-btn{
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            border: none;
        }

        .submit-btn:hover{
            transform: translateY(-2px);
        }

        @media(max-width:768px){

            .question-card{
                padding: 25px;
            }

            .question-title{
                font-size: 22px;
            }

            .top-bar{
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .timer-box{
                width: 100%;
                text-align: center;
            }

        }

    </style>
</head>
<body>

<div class="container exam-container">

    <!-- Top Bar -->
    <div class="top-bar">

        <div class="exam-info">

            <div class="exam-type">
                {{ q[1] }} CBT Practice
            </div>

            <div class="subject">
                {{ q[2] }}
            </div>

        </div>

        <div class="timer-box">
            ⏰ Time Left:
            <span id="timer">01:00</span>
        </div>

    </div>

    <!-- Question Card -->
    <div class="question-card">

        <h3 class="question-title">
            {{ q[3] }}
        </h3>

        <form method="POST" action="/check_answer">

            <!-- Option A -->
            <label class="option-box d-block">

                <input type="radio"
                       name="answer"
                       value="A"
                       required>

                A. {{ q[4] }}

            </label>

            <!-- Option B -->
            <label class="option-box d-block">

                <input type="radio"
                       name="answer"
                       value="B">

                B. {{ q[5] }}

            </label>

            <!-- Option C -->
            <label class="option-box d-block">

                <input type="radio"
                       name="answer"
                       value="C">

                C. {{ q[6] }}

            </label>

            <!-- Option D -->
            <label class="option-box d-block">

                <input type="radio"
                       name="answer"
                       value="D">

                D. {{ q[7] }}

            </label>

            <button class="btn btn-primary submit-btn mt-4">
                Submit Answer
            </button>

        </form>

    </div>

</div>

<script>

    // CBT Timer
    let timeLeft = 60;

    const timer = document.getElementById("timer");

    const countdown = setInterval(function(){

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        seconds = seconds < 10 ? "0" + seconds : seconds;

        timer.innerHTML = minutes + ":" + seconds;

        // warning color
        if(timeLeft <= 20){
            timer.style.color = "#ff4d4d";
        }

        timeLeft--;

        // auto submit
        if(timeLeft < 0){

            clearInterval(countdown);

            alert("Time is up!");

            document.querySelector("form").submit();
        }

    }, 1000);

</script>

</body>
</html>
