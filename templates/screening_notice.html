<!DOCTYPE html>
<html>
<head>

    <style>

        body{

        }

        .box{

            margin:80px auto;

            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);

        }

    </style>

</head>
<body>

<div class="box">

    <h2 class="mb-4">
        ℹ️ Admission Screening Notice

    <p class="lead">

    </p>

    <p class="text-muted">

    </p>

    <a href="/post_utme"
       class="btn btn-primary mt-3">

        ← Back

    </a>
