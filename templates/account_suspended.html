<!DOCTYPE html>
<html>
<head>

    <title>Account Suspended</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
        }

        .suspended-box{
            max-width:600px;
            margin:100px auto;
            background:white;
            padding:50px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
        }

        .icon{
            font-size:80px;
            margin-bottom:20px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="suspended-box">

        <div class="icon">
            🔒
        </div>

        <h2 class="text-danger">
            Account Suspended
        </h2>

        <p class="mt-3">

            Your account has been temporarily suspended.

        </p>

        <p class="text-muted">

            Please contact the administrator or support team
            for further assistance.

        </p>

        <a href="/"
           class="btn btn-primary mt-3">

            Return Home

        </a>

    </div>

</div>

</body>
</html>
