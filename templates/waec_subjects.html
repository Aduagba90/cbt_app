<!DOCTYPE html>
<html>
<head>
    <title>WAEC Subjects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg, #eef4ff, #f9fbff);
            font-family: 'Poppins', sans-serif;
        }

        .container-box{
            max-width: 1000px;
            margin: auto;
            margin-top: 50px;
            margin-bottom: 50px;
        }

        .main-card{
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0px 15px 40px rgba(0,0,0,0.08);
        }

        .title{
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle{
            color: #6c757d;
            margin-bottom: 35px;
        }

        .subject-card{
            border: 2px solid #edf2ff;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            transition: 0.3s;
            text-align: center;
        }

        .subject-card:hover{
            border-color: #198754;
            transform: translateY(-4px);
            background: #f8fff9;
        }

        .subject-title{
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .btn-start{
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
        }

    </style>
</head>
<body>

<div class="container container-box">

    <div class="main-card">

        <h1 class="title">
            WAEC Subject Selection
        </h1>

        <p class="subtitle">
            Select a WAEC subject and begin CBT practice.
        </p>

        <div class="row">

            {% for subject in subjects %}

            <div class="col-lg-4 col-md-6 mb-4">

                <div class="subject-card">

                    <div class="subject-title">
                        📘 {{ subject }}
                    </div>

                    <a href="/start_waec/{{ subject }}"
                       class="btn btn-success btn-start">

                        Start WAEC CBT

                    </a>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</div>

</body>
</html>
