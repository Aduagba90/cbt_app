<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg, #eef4ff, #f9fbff);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        .admin-container{
            max-width: 950px;
            margin: auto;
            margin-top: 50px;
            margin-bottom: 50px;
        }

        .admin-card{
            background: white;
            padding: 45px;
            border-radius: 25px;
            box-shadow: 0px 15px 40px rgba(0,0,0,0.08);
            animation: fadeIn 0.8s ease;
        }

        .title{
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #111827;
        }

        .subtitle{
            color: #6c757d;
            margin-bottom: 35px;
        }

        label{
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control{
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #dbe3f0;
            box-shadow: none;
        }

        .form-control:focus{
            border-color: #0d6efd;
            box-shadow: 0px 0px 0px 4px rgba(13,110,253,0.12);
        }

        textarea{
            resize: none;
        }

        .btn-submit{
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 14px;
            transition: 0.3s;
        }

        .btn-submit:hover{
            transform: translateY(-2px);
        }

        .section-title{
            font-size: 20px;
            font-weight: 600;
            margin-top: 25px;
            margin-bottom: 20px;
            color: #0d6efd;
        }

        @keyframes fadeIn{
            from{
                opacity: 0;
                transform: translateY(20px);
            }
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width:768px){

            .admin-card{
                padding: 30px 20px;
            }

            .title{
                font-size: 28px;
            }

        }

    </style>
</head>
<body>

<div class="container admin-container">

    <div class="admin-card">

        <h2 class="title">
            CBT Question Management
        </h2>

        <p class="subtitle">
            Add professional JAMB & WAEC CBT questions for students practice.
        </p>

        <form method="POST">

            <!-- Exam Type -->
            <div class="mb-4">

                <label>
                    Exam Type
                </label>

                <select name="exam_type"
                        class="form-control"
                        required>

                    <option value="">Select Exam Type</option>

                    <option value="JAMB">
                        JAMB
                    </option>

                    <option value="WAEC">
                        WAEC
                    </option>

                </select>

            </div>

            <!-- Subject -->
            <div class="mb-4">

                <label>
                    Subject
                </label>

                <select name="subject"
                        class="form-control"
                        required>

                    <option value="">
                        Select Subject
                    </option>

                    <option value="English">
                        English
                    </option>

                    <option value="Mathematics">
                        Mathematics
                    </option>

                    <option value="Physics">
                        Physics
                    </option>

                    <option value="Chemistry">
                        Chemistry
                    </option>

                    <option value="Biology">
                        Biology
                    </option>

                    <option value="Economics">
                        Economics
                    </option>

                    <option value="Government">
                        Government
                    </option>

                    <option value="Literature">
                        Literature
                    </option>

                    <option value="CRS">
                        CRS
                    </option>

                    <option value="CRS">
                        IRS
                    </option>

                    <option value="Commerce">
                        Commerce
                    </option>

                    <option value="Accounting">
                        Accounting
                    </option>

                    <option value="Geography">
                        Geography
                    </option>

                    <option value="Agricultural Science">
                        Agricultural Science
                    </option>

                    <option value="Civic Education">
                        Civic Education
                    </option>

                    <option value="Further Mathematics">
                        Further Mathematics
                    </option>

                    <option value="Computer Studies">
                        Computer Studies
                    </option>

                </select>

            </div>

            <!-- Question -->
            <div class="mb-4">

                <label>
                    Question
                </label>

                <textarea name="question"
                          class="form-control"
                          rows="4"
                          placeholder="Enter CBT question here..."
                          required></textarea>

            </div>

            <!-- Options -->
            <div class="section-title">
                Answer Options
            </div>

            <div class="mb-3">

                <label>
                    Option A
                </label>

                <input type="text"
                       name="option_a"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>
                    Option B
                </label>

                <input type="text"
                       name="option_b"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>
                    Option C
                </label>

                <input type="text"
                       name="option_c"
                       class="form-control"
                       required>

            </div>

            <div class="mb-4">

                <label>
                    Option D
                </label>

                <input type="text"
                       name="option_d"
                       class="form-control"
                       required>

            </div>

            <!-- Correct Answer -->
            <div class="mb-4">

                <label>
                    Correct Answer
                </label>

                <select name="correct_answer"
                        class="form-control"
                        required>

                    <option value="">
                        Select Correct Answer
                    </option>

                    <option value="A">
                        Option A
                    </option>

                    <option value="B">
                        Option B
                    </option>

                    <option value="C">
                        Option C
                    </option>

                    <option value="D">
                        Option D
                    </option>

                </select>

            </div>

            <!-- Explanation -->
            <div class="mb-4">

                <label>
                    Solution Explanation
                </label>

                <textarea name="explanation"
                          class="form-control"
                          rows="5"
                          placeholder="Explain why the answer is correct..."
                          required></textarea>

            </div>

            <!-- Submit -->
            <button class="btn btn-primary btn-submit">

                Add Question To CBT Database

            </button>

        </form>

    </div>

</div>

</body>
</html>
