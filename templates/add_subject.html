<!DOCTYPE html>
<html>

<head>

    <title>Add Subject</title>

    <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>➕ Add New Subject</h3>

        </div>

        <div class="card-body">

            <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">

                    <label>Exam Type</label>

                    <select name="exam_type"
                            class="form-control"
                            required>

                        <option value="">Select Exam Type</option>

                        <option>JAMB</option>

                        <option>WAEC</option>

                        <option>POST-UTME</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label>Subject Name</label>

                    <input
                        type="text"
                        name="subject_name"
                        class="form-control"
                        placeholder="Example: Use of English"
                        required>

                </div>

                <div class="mb-3">

                    <label>Subject Code</label>

                    <input
                        type="text"
                        name="subject_code"
                        class="form-control"
                        placeholder="Example: ENG">

                </div>

                <div class="mb-4">

                    <label>Status</label>

                    <select
                        name="status"
                        class="form-control">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>

                <button
                    class="btn btn-success">

                    💾 Save Subject

                </button>

                <a href="/manage_subjects"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
