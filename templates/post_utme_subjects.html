<!DOCTYPE html>
<html>
<head>
    <title>POST-UTME Subjects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fc;
            font-family:Poppins;
        }

        .box{
            max-width:800px;
            margin:80px auto;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
        }

        .subject-badge{
            display:inline-block;
            background:#eef4ff;
            color:#0d6efd;
            padding:10px 18px;
            border-radius:25px;
            margin:8px;
            font-weight:600;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box">

        <h2>
            📚 POST-UTME Subject Combination
        </h2>

        <p class="text-muted">

            {{ university }}

            {% if course %}
                • {{ course }}
            {% endif %}

        </p>

        <div class="mt-4">

            {% for subject in subjects %}

                <span class="subject-badge">

                    {{ subject[0] }}

                </span>

            {% endfor %}

        </div>

        <div class="mt-5">

            <a href="/start_post_utme?university={{ university }}{% if course %}&course={{ course }}{% endif %}"
            class="btn btn-primary btn-lg">

                🚀 Start POST-UTME Exam

            </a>

        </div>

    </div>

</div>

</body>
</html>
