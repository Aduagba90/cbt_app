<!DOCTYPE html>
<html>
<head>
    <title>Select University</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
            font-family:Poppins;
        }

        .container-box{
            max-width:800px;
            margin:auto;
            margin-top:80px;
        }

        .card-box{
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
        }

    </style>

</head>

<body>

<div class="container container-box">

    <div class="card-box">

        <h2 class="mb-4">
            🏛️ Select University
        </h2>

        <form method="GET" action="/post_utme_handler">

            <select
                name="university"
                class="form-select mb-4"
                required>

                <option value="">
                    Choose University
                </option>

                {% for university, mode in universities %}

                <option value="{{ university }}">
                    {{ university }} ({{ mode }})
                </option>

                {% endfor %}

            </select>

            <button class="btn btn-warning">

                Continue →

            </button>

        </form>

    </div>

</div>

</body>
</html>
