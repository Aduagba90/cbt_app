<!DOCTYPE html>
<html>
<head>

    <title>Manage Universities</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">
        🏫 POST-UTME University Management
    </h2>

    <a href="/admin"
       class="btn btn-secondary mb-3">

        ← Back

    </a>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>University</th>
                <th>Mode</th>
                <th>Duration</th>
                <th>Questions</th>
                <th>Pass Mark</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            {% for u in universities %}

            <tr>

                <td>{{ u[0] }}</td>
                <td>{{ u[1] }}</td>
                <td>{{ u[2] }}</td>
                <td>{{ u[3] }}</td>
                <td>{{ u[4] }}</td>
                <td>{{ u[5] }}</td>

                <td>

                    <a href="/edit_post_utme_university/{{ u[0] }}"
                       class="btn btn-warning btn-sm">

                        ✏️ Edit

                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
