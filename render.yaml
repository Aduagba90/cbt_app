# PrepNova CBT — Render.com Blueprint.
# In Render: New + → Blueprint → pick the GitHub repo → it reads this file and asks only
# for the values marked "sync: false".  See docs/GO_LIVE.md for the step-by-step guide.
services:
  - type: web
    name: prepnova-cbt
    runtime: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: prepnova-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/database.db
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: WAEC_ENABLED
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false
